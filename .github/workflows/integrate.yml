name: Node CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Scripts
        run: pnpm run test:scripts

      - name: Build Project
        run: pnpm run build

      - name: Compile Tests
        run: pnpm run test:compile

      # VS Code integration tests need a display; Linux runners are headless and require xvfb.
      - name: Test Project (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test

      - name: Test Project (macOS / Windows)
        if: runner.os != 'Linux'
        run: pnpm test

      - name: Lint Project
        run: pnpm run lint

      # Informational marketplace lookup; run once to avoid redundant API calls across the matrix.
      - name: Show Extension Data
        if: runner.os == 'Linux' && matrix.node-version == '22.x'
        run: pnpm run show-data

  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint validates workflow YAML/expressions and runs shellcheck over run: blocks.
      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@5d802a8ebdcb24d712925118c3a4596f571d8fcd # v1.81.0
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: any
